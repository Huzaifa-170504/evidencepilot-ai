[project]
name = "evidencepilot-research-tools"
version = "1.0.0"
description = "Read-only MCP server for EvidencePilot AI"
authors = [{ name = "Huzaifa Waqar Butt" }]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1.0",
  "mcp>=1.13,<2.0",
]

[project.scripts]
evidencepilot-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

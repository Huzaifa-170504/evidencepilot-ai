name: Deployment smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
  workflow_run:
    workflows: ["Deploy frontend to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify public frontend and API
        run: python scripts/verify_deployment.py
